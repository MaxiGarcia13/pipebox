name: Needs jobs
on:
  workflow_dispatch:
    inputs:
      fail_e2e:
        description: Fail the e2e job
        type: boolean
        default: false
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Lint marker
        run: echo LINT_OK
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test marker
        run: echo TEST_OK
  e2e:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: E2E marker
        run: |
          echo E2E_START
          if [ "${{ inputs.fail_e2e }}" = "true" ]; then
            echo E2E_FAIL
            exit 1
          fi
          echo E2E_OK

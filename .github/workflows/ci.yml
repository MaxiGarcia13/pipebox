name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/runner/go.mod
          cache-dependency-path: packages/runner/go.sum

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Test
        run: pnpm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/runner/go.mod
          cache-dependency-path: packages/runner/go.sum

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Plain install — golangci-lint-action is unreliable under act (exit 1 after add-path).
      - name: Install golangci-lint
        run: |
          set -euo pipefail
          version=v2.15.0
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "${version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install
        run: pnpm install

      - name: Lint
        run: pnpm lint

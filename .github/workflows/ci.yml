name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_call:

# A new push to the PR (synchronize) replaces the in-flight run for that PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/mcp/go.mod
          cache-dependency-path: |
            packages/runner/go.sum
            packages/mcp/go.sum

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Test
        run: pnpm test:unit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/mcp/go.mod
          cache-dependency-path: |
            packages/runner/go.sum
            packages/mcp/go.sum

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      # Plain install — golangci-lint-action is unreliable under act (exit 1 after add-path).
      - name: Install golangci-lint
        run: |
          set -euo pipefail
          version=v2.15.0
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "${version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install
        run: pnpm install

      - name: Lint
        run: pnpm lint

  e2e:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/mcp/go.mod
          cache-dependency-path: |
            packages/runner/go.sum
            packages/mcp/go.sum

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Install Electron system deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgtk-3-0 \
            libnotify4 \
            libnss3 \
            libxss1 \
            libxtst6 \
            libgbm1 \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libdrm2 \
            xauth

      - name: E2E
        run: xvfb-run -a pnpm test:e2e

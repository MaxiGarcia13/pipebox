name: Publish

on:
  workflow_call:
    inputs:
      tag_name:
        description: Git tag to publish (e.g. packages/runner/v0.1.0)
        required: true
        type: string
      create_release:
        description: Create the GitHub release; false only uploads assets
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish-cli:
    uses: ./.github/workflows/publish-cli.yml
    with:
      tag_name: ${{ inputs.tag_name }}
      create_release: ${{ inputs.create_release }}

  publish-desktop:
    needs: publish-cli
    uses: ./.github/workflows/publish-desktop.yml
    with:
      tag_name: ${{ inputs.tag_name }}
